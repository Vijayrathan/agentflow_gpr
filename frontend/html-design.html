<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NL2Sim — GPR Scenario Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eceef1;
        --panel: #ffffff;
        --panel-2: #f7f8fa;
        --panel-3: #f1f3f6;
        --line: #e4e7ec;
        --line-2: #d4d9e0;
        --line-3: #c2c8d2;
        --ink: #1b2027;
        --ink-2: #49515f;
        --ink-3: #717a89;
        --muted: #9aa2b1;
        --accent: #2f6bd4;
        --accent-2: #2456b3;
        --accent-soft: #eaf1fc;
        --accent-line: #bcd4f6;
        --amber: #c77f1a;
        --amber-soft: #fbf1df;
        --amber-line: #ecd3a0;
        --green: #2f9268;
        --green-soft: #e7f4ee;
        --danger: #c0492f;
        --shadow-sm:
          0 1px 2px rgba(20, 28, 45, 0.06), 0 1px 1px rgba(20, 28, 45, 0.04);
        --shadow:
          0 6px 22px rgba(22, 30, 50, 0.1), 0 2px 6px rgba(22, 30, 50, 0.06);
        --shadow-lg:
          0 18px 50px rgba(20, 28, 52, 0.18), 0 4px 14px rgba(20, 28, 52, 0.1);
        --r: 7px;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--ink);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow: hidden;
      }
      #root {
        height: 100vh;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        color: inherit;
      }
      input,
      textarea {
        font-family: inherit;
        color: inherit;
      }
      ::selection {
        background: var(--accent-soft);
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .tnum {
        font-variant-numeric: tabular-nums;
      }

      /* ---------- scrollbars ---------- */
      *::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      *::-webkit-scrollbar-thumb {
        background: #cdd3dc;
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: #b6bdc9;
        background-clip: content-box;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ============ APP SHELL ============ */
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* ---------- top menu bar ---------- */
      .appbar {
        height: 50px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--line-2);
        box-shadow: var(--shadow-sm);
        z-index: 40;
        position: relative;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        padding-right: 14px;
        border-right: 1px solid var(--line);
        height: 30px;
      }
      .brand .mark {
        width: 24px;
        height: 24px;
        flex: none;
      }
      .brand .name {
        font-weight: 700;
        font-size: 15px;
        letter-spacing: -0.2px;
      }
      .brand .name b {
        color: var(--accent);
        font-weight: 700;
      }
      .brand .tag {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-3);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-top: 1px;
      }

      .menu {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .mbtn {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 32px;
        padding: 0 11px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-2);
        white-space: nowrap;
        transition:
          background 0.12s,
          border-color 0.12s,
          color 0.12s;
      }
      .mbtn:hover {
        background: var(--panel-3);
        color: var(--ink);
      }
      .mbtn:active {
        background: var(--line);
      }
      .mbtn.on {
        background: var(--accent-soft);
        border-color: var(--accent-line);
        color: var(--accent-2);
      }
      .mbtn .ic {
        width: 15px;
        height: 15px;
        flex: none;
        opacity: 0.85;
      }
      .mbtn .caret {
        width: 9px;
        height: 9px;
        opacity: 0.5;
        margin-left: -2px;
      }
      .mdiv {
        width: 1px;
        height: 22px;
        background: var(--line);
        margin: 0 5px;
        flex: none;
      }
      .spacer {
        flex: 1;
      }

      .statuschip {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 28px;
        padding: 0 11px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 20px;
        font-size: 11.5px;
        color: var(--ink-2);
        font-weight: 500;
        white-space: nowrap;
      }
      .statuschip .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 3px var(--green-soft);
      }
      .statuschip b {
        font-family: var(--mono);
        color: var(--ink);
        font-weight: 600;
      }

      /* ---------- dropdown menus ---------- */
      .pop {
        position: absolute;
        top: 46px;
        background: var(--panel);
        border: 1px solid var(--line-2);
        border-radius: 9px;
        box-shadow: var(--shadow-lg);
        z-index: 60;
        padding: 5px;
        min-width: 230px;
        animation: pop 0.12s ease-out;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(-4px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .pop .head {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 8px 10px 5px;
      }
      .pop .item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 12.5px;
        color: var(--ink-2);
        transition: background 0.1s;
        width: 100%;
        text-align: left;
        border: none;
        background: none;
      }
      .pop .item:hover {
        background: var(--panel-3);
        color: var(--ink);
      }
      .pop .item:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .pop .item:disabled:hover {
        background: none;
      }
      .pop .item .ic {
        width: 15px;
        height: 15px;
        flex: none;
        opacity: 0.8;
      }
      .pop .item .sub {
        font-size: 11px;
        color: var(--ink-3);
        margin-top: 1px;
      }
      .pop .item .meta {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted);
      }
      .pop .item.sel {
        background: var(--accent-soft);
        color: var(--accent-2);
      }
      .pop .item.sel .check {
        color: var(--accent);
      }
      .pop .col {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .pop .sep {
        height: 1px;
        background: var(--line);
        margin: 5px 6px;
      }

      /* ============ BODY SPLIT ============ */
      .body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .viz {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--bg);
      }

      /* ---------- viz toolbar ---------- */
      .viztoolbar {
        height: 44px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        color: var(--ink-3);
      }
      .crumb b {
        color: var(--ink);
        font-weight: 600;
      }
      .crumb .sl {
        color: var(--line-3);
      }
      .tgroup {
        display: flex;
        align-items: center;
        gap: 1px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 2px;
      }
      .tbtn {
        width: 29px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        border-radius: 5px;
        color: var(--ink-2);
        transition:
          background 0.1s,
          color 0.1s;
      }
      .tbtn:hover {
        background: var(--panel);
        color: var(--ink);
        box-shadow: var(--shadow-sm);
      }
      .tbtn.on {
        background: var(--panel);
        color: var(--accent);
        box-shadow: var(--shadow-sm);
      }
      .tbtn .ic {
        width: 16px;
        height: 16px;
      }
      .zoomread {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-2);
        min-width: 42px;
        text-align: center;
      }

      .runbtn {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 14px 0 12px;
        margin-left: 2px;
        background: var(--accent);
        color: #fff;
        border: 1px solid var(--accent-2);
        border-radius: 7px;
        font-size: 12.5px;
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(36, 86, 179, 0.35);
        transition:
          filter 0.12s,
          transform 0.05s;
      }
      .runbtn:hover {
        filter: brightness(1.06);
      }
      .runbtn:active {
        transform: translateY(1px);
      }
      .runbtn .ic {
        width: 14px;
        height: 14px;
      }
      .runbtn[disabled] {
        opacity: 0.6;
        cursor: default;
        filter: none;
      }

      /* ---------- viz body: rail + stage ---------- */
      .vizbody {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .rail {
        width: clamp(190px, 18vw, 260px);
        flex: none;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
        transition:
          width 0.2s,
          margin 0.2s;
      }
      .rail.collapsed {
        width: 0;
        border-right: none;
        overflow: hidden;
      }
      .rail-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 12px 8px;
      }
      .rail-head .t {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .rail-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 0 8px 12px;
      }

      .rail-tabs {
        display: flex;
        gap: 4px;
        padding: 8px 8px 6px;
        border-bottom: 1px solid var(--line);
      }
      .rail-tab {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 8px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: none;
        cursor: pointer;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
        transition:
          background 0.1s,
          color 0.1s;
      }
      .rail-tab:hover {
        background: var(--panel-3);
        color: var(--ink-2);
      }
      .rail-tab.on {
        background: var(--accent-soft);
        border-color: var(--accent-line);
        color: var(--accent);
      }
      .rail-tab-count {
        font-family: var(--mono);
        font-size: 10px;
        background: var(--accent);
        color: #fff;
        padding: 0 5px;
        border-radius: 9px;
        line-height: 15px;
      }

      /* generated .in file viewer — overlays the stage canvas */
      .fileview {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: flex;
        flex-direction: column;
        background: var(--panel-2);
      }
      .fileview-head {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .fileview-name {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink);
      }
      .fileview-head .badge {
        font-size: 10.5px;
        color: var(--ink-3);
        border: 1px solid var(--line-2);
        border-radius: 5px;
        padding: 1px 6px;
      }
      .fileview-body {
        flex: 1;
        overflow: auto;
        padding: 14px;
      }
      .fileview-body .codeblk {
        min-height: 100%;
      }
      .fileview-empty {
        color: var(--muted);
        font-size: 12.5px;
        padding: 20px;
      }
      .fileview-head .outcome-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font: inherit;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--accent);
        border: 1px solid var(--line-2);
        border-radius: 6px;
        padding: 3px 9px;
        background: #fff;
        cursor: pointer;
        margin-left: 4px;
      }
      .fileview-head .outcome-btn:hover {
        background: var(--panel-3);
        border-color: var(--accent);
      }
      .fileview-head .vsel {
        font: inherit;
        font-size: 11px;
        border: 1px solid var(--line-2);
        border-radius: 5px;
        padding: 2px 4px;
        background: #fff;
        color: var(--ink-2);
      }
      .ascan-wrap {
        height: 100%;
        min-height: 260px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
      }

      .tree-sec {
        margin-bottom: 6px;
      }
      .tree-sec-head {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 6px 6px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--ink-2);
        user-select: none;
      }
      .tree-sec-head:hover {
        background: var(--panel-3);
      }
      .tree-sec-head .chev {
        width: 12px;
        height: 12px;
        color: var(--muted);
        transition: transform 0.15s;
      }
      .tree-sec-head.closed .chev {
        transform: rotate(-90deg);
      }
      .tree-sec-head .count {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--muted);
        background: var(--panel-3);
        padding: 1px 6px;
        border-radius: 10px;
      }
      .tree-sec-head:hover .add-mini {
        opacity: 1;
      }
      .add-mini {
        opacity: 0;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: none;
        color: var(--ink-3);
        border-radius: 4px;
        transition:
          opacity 0.12s,
          background 0.1s;
      }
      .add-mini:hover {
        background: var(--line);
        color: var(--accent);
      }

      .tnode {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 8px;
        margin: 1px 0;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid transparent;
        transition:
          background 0.1s,
          border-color 0.1s;
      }
      .tnode:hover {
        background: var(--panel-3);
      }
      .tnode.sel {
        background: var(--accent-soft);
        border-color: var(--accent-line);
      }
      .tnode .sw {
        width: 13px;
        height: 13px;
        border-radius: 3px;
        flex: none;
        border: 1px solid rgba(0, 0, 0, 0.12);
      }
      .tnode .tn-name {
        font-size: 12px;
        color: var(--ink);
        font-weight: 500;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tnode .tn-meta {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--ink-3);
      }
      .tnode .vis {
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        opacity: 0;
        border: none;
        background: none;
        border-radius: 4px;
      }
      .tnode:hover .vis {
        opacity: 1;
      }
      .tnode .vis:hover {
        background: var(--line);
        color: var(--ink);
      }
      .tnode .vis.off {
        opacity: 1;
        color: var(--line-3);
      }
      .tnode .tn-out {
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
        color: var(--accent);
        border: none;
        background: none;
        border-radius: 4px;
        cursor: pointer;
        padding: 0;
      }
      .tnode .tn-out:hover {
        background: var(--line);
      }

      /* ---------- stage ---------- */
      .stage {
        flex: 1;
        position: relative;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .stage-canvas {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: linear-gradient(var(--panel-2), var(--panel-2));
      }
      .stage svg:not(.feather) {
        display: block;
        width: 100%;
        height: 100%;
      }
      .stage .legend {
        position: absolute;
        left: 14px;
        bottom: 14px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(4px);
        border: 1px solid var(--line-2);
        border-radius: 8px;
        padding: 9px 11px;
        box-shadow: var(--shadow-sm);
        font-size: 11px;
      }
      .legend .lh {
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .legend .lrow {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 3px 0;
        color: var(--ink-2);
        white-space: nowrap;
      }
      .legend .lrow .ls {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        flex: none;
      }
      .legend .lrow .lname {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .legend .lrow .leps {
        margin-left: 14px;
        color: var(--muted);
        font-size: 10px;
      }

      .stage .hud {
        position: absolute;
        right: 14px;
        top: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
      }
      .hud .pill {
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(4px);
        border: 1px solid var(--line-2);
        border-radius: 7px;
        padding: 5px 10px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--ink-2);
        box-shadow: var(--shadow-sm);
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .hud .pill b {
        color: var(--ink);
      }
      .hud .pill .k {
        color: var(--muted);
      }

      .stage .viewtabs {
        position: absolute;
        left: 14px;
        top: 12px;
        display: flex;
        gap: 4px;
        align-items: center;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(4px);
        border: 1px solid var(--line-2);
        border-radius: 7px;
        padding: 3px;
        box-shadow: var(--shadow-sm);
        font-size: 11px;
        z-index: 5;
      }
      .viewtabs .vt {
        border: 0;
        background: transparent;
        padding: 4px 10px;
        border-radius: 5px;
        cursor: pointer;
        color: var(--muted);
        font: inherit;
      }
      .viewtabs .vt.on {
        background: rgba(37, 99, 235, 0.12);
        color: var(--ink);
        font-weight: 600;
      }
      .viewtabs .vt:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .viewtabs .vsel {
        font: inherit;
        font-size: 11px;
        border: 1px solid var(--line-2);
        border-radius: 5px;
        padding: 2px 4px;
        background: #fff;
        color: var(--ink-2);
        max-width: 150px;
      }

      .stage .caveats-chip {
        position: absolute;
        left: 14px;
        top: 52px;
        display: flex;
        align-items: center;
        gap: 5px;
        background: rgba(255, 251, 240, 0.94);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(217, 164, 65, 0.45);
        border-left: 3px solid #d9a441;
        border-radius: 7px;
        padding: 4px 9px;
        box-shadow: var(--shadow-sm);
        font-size: 10px;
        font-weight: 600;
        color: #9a7118;
        cursor: pointer;
        z-index: 4;
      }
      .caveats-chip .feather {
        stroke: #9a7118;
      }
      .stage .caveats {
        position: absolute;
        left: 14px;
        top: 52px;
        max-width: min(236px, 24vw);
        max-height: min(55%, 340px);
        overflow-y: auto;
        background: rgba(255, 251, 240, 0.94);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(217, 164, 65, 0.45);
        border-left: 3px solid #d9a441;
        border-radius: 8px;
        padding: 9px 11px;
        box-shadow: var(--shadow-sm);
        font-size: 10.5px;
        color: var(--ink-2);
        z-index: 4;
      }
      .caveats .ch {
        display: flex;
        align-items: center;
        gap: 5px;
        width: 100%;
        border: none;
        background: none;
        padding: 0;
        text-align: left;
        cursor: pointer;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #9a7118;
        margin-bottom: 6px;
      }
      .caveats .ch .feather {
        stroke: #9a7118;
      }
      .caveats .crow {
        margin: 5px 0;
        line-height: 1.45;
      }
      .caveats .crow::before {
        content: "· ";
        color: #d9a441;
        font-weight: 700;
      }

      /* forward-model reuse offer — compact top-right overlay */
      .stage .reuse-bar {
        position: absolute;
        right: 14px;
        top: 52px;
        max-width: min(280px, 30vw);
        background: rgba(240, 249, 244, 0.96);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(46, 139, 87, 0.4);
        border-left: 3px solid #2e8b57;
        border-radius: 8px;
        padding: 9px 11px;
        box-shadow: var(--shadow-sm);
        font-size: 10.5px;
        color: var(--ink-2);
        z-index: 5;
      }
      .reuse-bar .rb-head {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        color: #1f6b42;
      }
      .reuse-bar .rb-head .feather {
        stroke: #1f6b42;
        flex: none;
      }
      .reuse-bar .rb-x {
        margin-left: auto;
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
        line-height: 0;
      }
      .reuse-bar .rb-meta {
        margin-top: 4px;
        line-height: 1.45;
      }
      .reuse-bar .rb-diffs {
        margin-top: 4px;
      }
      .reuse-bar .rb-diffs summary {
        cursor: pointer;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #1f6b42;
      }
      .reuse-bar .rb-diff {
        margin: 3px 0 0 8px;
      }
      .reuse-bar .rb-diff code {
        font-size: 9.5px;
      }
      .reuse-bar .rb-actions {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .reuse-bar .rb-btn {
        border: 1px solid rgba(46, 139, 87, 0.5);
        background: #fff;
        color: #1f6b42;
        border-radius: 6px;
        padding: 4px 9px;
        font-size: 10px;
        font-weight: 600;
        cursor: pointer;
      }
      .reuse-bar .rb-btn.primary {
        background: #2e8b57;
        border-color: #2e8b57;
        color: #fff;
      }

      .solving-bar {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 2.5px;
        background: var(--accent-soft);
        overflow: hidden;
      }
      .solving-bar i {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        background: var(--accent);
        transition: width 0.1s linear;
      }

      /* ---------- bottom dock ---------- */
      .dock {
        flex: none;
        background: var(--panel);
        border-top: 1px solid var(--line-2);
        display: flex;
        flex-direction: column;
        transition: height 0.2s;
        box-shadow: 0 -2px 10px rgba(20, 28, 45, 0.03);
      }
      .dock-tabs {
        height: 38px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 10px;
        border-bottom: 1px solid var(--line);
      }
      .dtab {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 38px;
        padding: 0 12px;
        border: none;
        background: none;
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-3);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .dtab:hover {
        color: var(--ink);
      }
      .dtab.on {
        color: var(--accent-2);
        border-bottom-color: var(--accent);
      }
      .dtab .ic {
        width: 14px;
        height: 14px;
      }
      .dock-collapse {
        margin-left: auto;
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--ink-3);
      }
      .dock-collapse:hover {
        color: var(--ink);
      }
      .dock-body {
        flex: 1;
        overflow: auto;
        min-height: 0;
      }

      /* inspector grid */
      .insp {
        padding: 14px 16px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 10px 22px;
        align-content: start;
      }
      .insp-empty {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12.5px;
      }
      .insp-empty .ic {
        width: 26px;
        height: 26px;
        opacity: 0.5;
      }
      .fld {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .fld label {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .fld .ctl {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .inp {
        height: 30px;
        border: 1px solid var(--line-2);
        border-radius: 6px;
        background: var(--panel);
        padding: 0 9px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink);
        width: 100%;
        transition:
          border-color 0.12s,
          box-shadow 0.12s;
      }
      .inp:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .inp:disabled {
        background: var(--panel-3);
        color: var(--ink-3);
      }
      .unit {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        flex: none;
      }
      .seg {
        display: flex;
        border: 1px solid var(--line-2);
        border-radius: 6px;
        overflow: hidden;
      }
      .seg button {
        flex: 1;
        height: 30px;
        border: none;
        background: var(--panel);
        font-size: 11.5px;
        color: var(--ink-2);
        border-right: 1px solid var(--line);
      }
      .seg button:last-child {
        border-right: none;
      }
      .seg button.on {
        background: var(--accent-soft);
        color: var(--accent-2);
        font-weight: 600;
      }
      .sel-ctl {
        height: 30px;
        border: 1px solid var(--line-2);
        border-radius: 6px;
        background: var(--panel);
        padding: 0 8px;
        font-size: 12px;
        color: var(--ink);
        width: 100%;
      }
      .insp-title {
        grid-column: 1/-1;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 2px;
      }
      .insp-title .sw {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        border: 1px solid rgba(0, 0, 0, 0.14);
      }
      .insp-title h4 {
        margin: 0;
        font-size: 13.5px;
        font-weight: 600;
      }
      .insp-title .badge {
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--ink-3);
        background: var(--panel-3);
        padding: 2px 8px;
        border-radius: 10px;
      }
      .insp-title .del {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 5px;
        height: 26px;
        padding: 0 10px;
        border: 1px solid var(--line-2);
        border-radius: 6px;
        background: var(--panel);
        font-size: 11.5px;
        color: var(--danger);
        font-weight: 500;
      }
      .insp-title .del:hover {
        background: #fbeeea;
        border-color: #e7c3b8;
      }

      /* ============ CHAT PANE ============ */
      .chat {
        width: clamp(300px, 28vw, 420px);
        flex: none;
        position: relative;
        background: var(--panel);
        border-left: 1px solid var(--line-2);
        display: flex;
        flex-direction: column;
        min-height: 0;
        transition:
          width 0.22s,
          margin 0.22s;
      }
      /* bound the user-resized inline width; scoped to :not(.collapsed) so
         the collapse-to-zero animation keeps working */
      .chat:not(.collapsed) {
        min-width: 280px;
        max-width: min(680px, 72vw);
      }
      .chat.resizing {
        transition: none;
      }
      .chat.collapsed {
        width: 0;
        border-left: none;
        overflow: hidden;
      }
      .chat-resizer {
        position: absolute;
        left: -4px;
        top: 0;
        bottom: 0;
        width: 8px;
        cursor: col-resize;
        z-index: 12;
        touch-action: none;
      }
      .chat-resizer:hover,
      .chat-resizer.active {
        background: linear-gradient(
          90deg,
          transparent 2px,
          rgba(37, 99, 235, 0.35) 3px,
          rgba(37, 99, 235, 0.35) 5px,
          transparent 6px
        );
      }
      .chat.collapsed .chat-resizer {
        display: none;
      }
      /* ── User gate + chat list strip (multi-chat per user) ─────────── */
      .user-gate {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(27, 32, 39, 0.45);
        backdrop-filter: blur(3px);
      }
      .user-gate-card {
        width: clamp(280px, 32vw, 380px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 22px 20px;
        box-shadow: 0 12px 40px rgba(27, 32, 39, 0.25);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .user-gate-card .ugt {
        font-weight: 700;
        font-size: 16px;
      }
      .user-gate-card .ugs {
        font-size: 12px;
        color: var(--ink-3);
        line-height: 1.5;
      }
      .user-gate-card input {
        border: 1px solid var(--line-2);
        border-radius: 8px;
        padding: 9px 11px;
        font-size: 13px;
        outline: none;
      }
      .user-gate-card input:focus {
        border-color: var(--accent-line);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .user-gate-card .uge {
        font-size: 11.5px;
        color: #c0392b;
      }
      .user-gate-card .ugbtn {
        border: none;
        border-radius: 8px;
        padding: 9px 0;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(150deg, #3f78dd, #2456b3);
        cursor: pointer;
      }
      .chat-strip {
        position: relative;
        flex: none;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-2);
      }
      .chat-strip .cs-picker {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--ink);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        text-align: left;
      }
      .chat-strip .cs-picker:hover {
        background: var(--panel-3);
      }
      .chat-strip .cs-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chat-strip .cs-chev {
        flex: none;
        transform: rotate(90deg);
        color: var(--ink-3);
      }
      .chat-strip .cs-picker.open .cs-chev {
        transform: rotate(-90deg);
      }
      .chat-strip .cs-new,
      .chat-strip .cs-user {
        flex: none;
        padding: 5px 9px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel);
        color: var(--ink-2);
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        max-width: 9em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chat-strip .cs-new:hover {
        color: var(--accent);
        border-color: var(--accent-line);
        background: var(--accent-soft);
      }
      .chat-strip .cs-user:hover {
        background: var(--panel-3);
      }
      .chat-strip .cs-pop {
        position: absolute;
        top: calc(100% + 4px);
        left: 10px;
        right: 10px;
        z-index: 60;
        max-height: min(300px, 40vh);
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--line-2);
        border-radius: 9px;
        box-shadow: 0 10px 30px rgba(27, 32, 39, 0.16);
        padding: 4px;
        display: flex;
        flex-direction: column;
      }
      .chat-strip .cs-item {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 7px 9px;
        border: none;
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
        text-align: left;
      }
      .chat-strip .cs-item:hover {
        background: var(--panel-2);
      }
      .chat-strip .cs-item.active {
        background: var(--accent-soft);
      }
      .chat-strip .cs-item-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chat-strip .cs-item-meta {
        font-size: 10.5px;
        color: var(--ink-3);
      }
      .chat-strip .cs-empty {
        padding: 10px;
        font-size: 12px;
        color: var(--ink-3);
        text-align: center;
      }
      .chat.collapsed .chat-strip {
        display: none;
      }

      .chat-head {
        flex: none;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .chat-av {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(150deg, #3f78dd, #2456b3);
        box-shadow: 0 2px 6px rgba(36, 86, 179, 0.3);
      }
      .chat-head .ct {
        font-weight: 600;
        font-size: 13.5px;
      }
      .chat-head .cs {
        font-size: 11px;
        color: var(--ink-3);
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 1px;
      }
      .chat-head .cs .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
      }
      .chat-head .hbtn {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--ink-3);
      }
      .chat-head .hbtn:hover {
        color: var(--ink);
        background: var(--panel-3);
      }

      .chat-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 16px 14px 8px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        scroll-behavior: smooth;
      }
      .msg {
        display: flex;
        gap: 10px;
        max-width: 100%;
        animation: msgin 0.25s ease-out;
      }
      @keyframes msgin {
        from {
          transform: translateY(7px);
        }
        to {
          transform: none;
        }
      }
      .msg .av {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .msg.bot .av {
        background: linear-gradient(150deg, #3f78dd, #2456b3);
      }
      .msg .bubble {
        font-size: 12.8px;
        line-height: 1.55;
        color: var(--ink);
        min-width: 0;
      }
      .msg.bot .bubble {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 3px 11px 11px 11px;
        padding: 9px 12px;
      }
      .msg.user {
        flex-direction: row-reverse;
      }
      .msg.user .av {
        background: var(--panel-3);
        border: 1px solid var(--line-2);
        color: var(--ink-2);
      }
      .msg.user .bubble {
        background: var(--accent);
        color: #fff;
        border-radius: 11px 3px 11px 11px;
        padding: 9px 12px;
      }
      .msg .bubble p {
        margin: 0 0 7px;
      }
      .msg .bubble p:last-child {
        margin: 0;
      }
      .msg .bubble code {
        font-family: var(--mono);
        font-size: 11.5px;
        background: rgba(47, 107, 212, 0.09);
        color: var(--accent-2);
        padding: 1px 5px;
        border-radius: 4px;
      }
      .msg.user .bubble code {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
      }
      .msg .bubble strong {
        font-weight: 600;
      }

      /* action card inside bot msg */
      .act-card {
        margin-top: 9px;
        border: 1px solid var(--accent-line);
        background: var(--accent-soft);
        border-radius: 8px;
        padding: 9px 11px;
      }
      .act-card .ah {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent-2);
        margin-bottom: 6px;
      }
      .act-card .ar {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--ink-2);
        padding: 2px 0;
      }
      .act-card .ar .sw {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        flex: none;
        border: 1px solid rgba(0, 0, 0, 0.12);
      }
      .act-card .ar .v {
        font-family: var(--mono);
        color: var(--ink);
        margin-left: auto;
      }

      .typing {
        display: flex;
        gap: 4px;
        padding: 4px 2px;
      }
      .typing i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
        animation: tdot 1.2s infinite;
      }
      .typing i:nth-child(2) {
        animation-delay: 0.18s;
      }
      .typing i:nth-child(3) {
        animation-delay: 0.36s;
      }
      @keyframes tdot {
        0%,
        60%,
        100% {
          opacity: 0.3;
          transform: translateY(0);
        }
        30% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        padding: 4px 0 2px 34px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 11px;
        border-radius: 16px;
        border: 1px solid var(--accent-line);
        background: var(--panel);
        color: var(--accent-2);
        font-size: 12px;
        font-weight: 500;
        transition:
          background 0.12s,
          transform 0.05s;
      }
      .chip:hover {
        background: var(--accent-soft);
      }
      .chip:active {
        transform: scale(0.97);
      }
      .chip .ic {
        width: 13px;
        height: 13px;
      }

      .chat-input {
        flex: none;
        border-top: 1px solid var(--line);
        padding: 11px 12px 13px;
      }
      .chat-inwrap {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        border: 1px solid var(--line-2);
        border-radius: 11px;
        background: var(--panel);
        padding: 7px 7px 7px 12px;
        transition:
          border-color 0.12s,
          box-shadow 0.12s;
      }
      .chat-inwrap:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .chat-inwrap textarea {
        flex: 1;
        border: none;
        resize: none;
        background: none;
        font-size: 12.8px;
        line-height: 1.5;
        max-height: 120px;
        outline: none;
        padding: 3px 0;
      }
      .send {
        width: 32px;
        height: 32px;
        flex: none;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: filter 0.12s;
      }
      .send:hover {
        filter: brightness(1.08);
      }
      .send[disabled] {
        background: var(--line-2);
        color: var(--muted);
        cursor: default;
      }
      .chat-hint {
        font-size: 10.5px;
        color: var(--muted);
        text-align: center;
        margin-top: 8px;
        font-family: var(--mono);
      }

      /* ---------- toasts ---------- */
      .toasts {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 80;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--ink);
        color: #fff;
        padding: 9px 14px;
        border-radius: 9px;
        font-size: 12.5px;
        box-shadow: var(--shadow-lg);
        animation: tin 0.25s ease-out;
        max-width: 440px;
      }
      .toast .ic {
        width: 15px;
        height: 15px;
        flex: none;
      }
      .toast.ok .ic {
        color: #5fd6a0;
      }
      .toast.info .ic {
        color: #7fb0f5;
      }
      .toast b {
        font-weight: 600;
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* modal */
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(22, 30, 48, 0.4);
        backdrop-filter: blur(2px);
        z-index: 70;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fade 0.15s;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .modal {
        background: var(--panel);
        border-radius: 13px;
        box-shadow: var(--shadow-lg);
        width: 520px;
        max-width: 92vw;
        overflow: hidden;
        animation: pop 0.16s ease-out;
      }
      .modal .mh {
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .modal .mh h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .modal .mh .x {
        margin-left: auto;
        width: 28px;
        height: 28px;
        border: none;
        background: var(--panel-2);
        border-radius: 7px;
        color: var(--ink-3);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal .mh .x:hover {
        background: var(--panel-3);
        color: var(--ink);
      }
      .modal .mb {
        padding: 18px;
        max-height: 60vh;
        overflow: auto;
      }
      .modal .mf {
        padding: 13px 18px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        background: var(--panel-2);
      }
      .btn {
        height: 34px;
        padding: 0 16px;
        border-radius: 8px;
        font-size: 12.5px;
        font-weight: 600;
        border: 1px solid var(--line-2);
        background: var(--panel);
        color: var(--ink-2);
      }
      .btn:hover {
        background: var(--panel-3);
      }
      .btn.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent-2);
      }
      .btn.primary:hover {
        filter: brightness(1.06);
      }

      .codeblk {
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.6;
        background: #0d1117;
        color: #c9d4e3;
        border-radius: 9px;
        padding: 14px 16px;
        overflow: auto;
        white-space: pre;
      }
      .codeblk .c {
        color: #6b7785;
      }
      .codeblk .k {
        color: #7fb0f5;
      }
      .codeblk .n {
        color: #e6c07b;
      }
      .codeblk .s {
        color: #8fd9a8;
      }

      .iconbtn {
        background: none;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      svg.feather {
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
    </style>
  </head>
