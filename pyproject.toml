[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-gpr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LangGraph and LangChain dependencies
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-experimental>=0.3.0",
    # Flask web framework
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    # OpenAI API
    "openai>=1.0.0",
    # Pydantic for data validation
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.1",
    # Vector database and embeddings
    "qdrant-client>=1.7.0",
    "FlagEmbedding>=1.2.0",
    # Document processing
    "docling>=1.0.0",
    "rapidocr-onnxruntime>=1.4.4; sys_platform == 'linux'",
    "onnxruntime-gpu>=1.23.2; sys_platform == 'linux'",
    # Scientific computing
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "aiosqlite>=0.17.0",
    "cython>=3.2.4",
    "h5py>=3.15.1",
    "terminaltables>=3.1.10",
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*", "gpr_workspace*", "retrieval_docs*"]
