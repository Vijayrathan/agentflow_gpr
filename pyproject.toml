[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-gpr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "pydantic>=2.0.0",
    "pydantic-ai>=0.0.1",
    "openai>=1.0.0",
    "docling>=1.0.0",
    "langchain-experimental>=0.0.50",
    "langchain-community>=0.0.20",
    "FlagEmbedding>=1.2.0",
    "qdrant-client>=1.7.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*", "gpr_workspace*", "retrieval_docs*"]
